# Modified for macbook-sendspin: ALSA-only stateless appliance.
# No hooks, card-name lookup, mixers, plugins, default, or resampling PCM.
pcm.hw {
    @args [ CARD DEV ]
    @args.CARD { type integer }
    @args.DEV { type integer }
    type hw
    card $CARD
    device $DEV
    subdevice -1
    nonblock false
}
